services:
  postgres:
    image: postgres:16-alpine
    container_name: customer-onboarding-postgres
    environment:
      POSTGRES_DB: customer_onboarding
      POSTGRES_USER: customer_onboarding_app
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_onboarding_app -d customer_onboarding"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data: