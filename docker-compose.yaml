services:
  postgres:
    image: postgres:16-alpine
    container_name: customer-onboarding-postgres
    environment:
      POSTGRES_DB: customer_onboarding
      POSTGRES_USER: customer_onboarding_app
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_onboarding_app -d customer_onboarding"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  app:
    container_name: customer-onboarding-app
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer_onboarding
      JWT_SECRET: 0123456789abcdef0123456789abcdef
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data: