databaseChangeLog:
  - changeSet:
      id: 002-create-account
      author: yulialar
      changes:
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_account
                    nullable: false
              - column:
                  name: customer_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: iban
                  type: VARCHAR(34)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_account_iban
              - column:
                  name: account_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: NUMERIC(19, 4)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_account_customer
            baseTableName: account
            baseColumnNames: customer_id
            referencedTableName: customer
            referencedColumnNames: id

        - createIndex:
            indexName: idx_account_customer_id
            tableName: account
            columns:
              - column:
                  name: customer_id