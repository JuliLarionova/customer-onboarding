spring:
  application:
    name: customer-onboarding

  datasource:
    url: jdbc:postgresql://localhost:5432/customer_onboarding
    username: customer_onboarding_app
    password: localdev
    hikari:
      maximum-pool-size: 2
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

logging:
  level:
    com.lar.customeronboarding: DEBUG

app:
  registration:
    allowed-countries:
      - NL
      - BE
  security:
    jwt:
      secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef}
      time-to-live: 15m
