spring:
  application:
    name: customer-onboarding

  datasource:
    url: jdbc:postgresql://localhost:5432/customer_onboarding
    username: ${DB_USERNAME:customer_onboarding_app}
    password: ${DB_PASSWORD:localdev}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

logging:
  level:
    com.lar.customeronboarding: INFO

app:
  registration:
    allowed-countries:
      - NL
      - BE
  security:
    jwt:
      secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef}
      time-to-live: 15m
  rate-limit:
    enabled: true
    capacity: 10
    refill-tokens: 2
    refill-period: 1s

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
