spring:
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

logging:
  level:
    org.testcontainers: warn
    liquibase: warn

app:
  rate-limit:
    enabled: false
    capacity: 1000
    refill-tokens: 1000
    refill-period: 1s